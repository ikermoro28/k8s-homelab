apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: homelab
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        - name: init-php
          image: busybox:1.36
          command: ["cp", "/cfg/index.php", "/var/www/html/index.php"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: php-config
              mountPath: /cfg
            - name: webroot
              mountPath: /var/www/html

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m        # 50 milicores = 0.05 CPU
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10   # Espera 10s antes del primer check
            periodSeconds: 15         # Comprueba cada 15s
            failureThreshold: 3       # 3 fallos consecutivos → reinicia el contenedor
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5    # Nginx arranca rápido, 5s es suficiente
            periodSeconds: 10
            failureThreshold: 2       # 2 fallos → lo saca del Service
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: webroot
              mountPath: /var/www/html

        - name: php-fpm
          image: php:8.3-fpm-alpine
          command: ["sh", "-c", "docker-php-ext-install mysqli && php-fpm -F"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 9000              # PHP-FPM no habla HTTP, comprobamos que el socket TCP está abierto
            initialDelaySeconds: 30   # Necesita tiempo para compilar mysqli
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 2
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-name
          volumeMounts:
            - name: webroot
              mountPath: /var/www/html

      volumes:
        - name: php-config
          configMap:
            name: nginx-php
            items:
              - key: index.php
                path: index.php
        - name: nginx-conf
          configMap:
            name: nginx-php
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: webroot
          emptyDir: {}
