apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: homelab
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8">
      <title>K8s Homelab</title>
      <style>
        body { font-family: monospace; background: #0d1117; color: #58a6ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 2rem 3rem; text-align: center; }
        h1 { color: #e6edf3; font-size: 1.5rem; }
        .pod { font-size: 1.1rem; color: #3fb950; margin: 1rem 0; }
        .label { color: #8b949e; font-size: 0.9rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>K8s Homelab</h1>
        <div class="label">Sirviendo desde el pod:</div>
        <div class="pod">HOSTNAME_PLACEHOLDER</div>
        <div class="label">Refresca para ver el balanceo entre réplicas</div>
      </div>
    </body>
    </html>

  start.sh: |
    #!/bin/sh
    # Reemplaza el placeholder con el hostname real del pod en tiempo de arranque
    sed "s/HOSTNAME_PLACEHOLDER/${HOSTNAME}/" /usr/share/nginx/html/index.html.tpl > /usr/share/nginx/html/index.html
    exec nginx -g 'daemon off;'
