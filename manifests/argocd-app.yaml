apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ikermoro28/k8s-homelab.git
    targetRevision: main
    path: manifests              # ArgoCD gestiona todo lo que hay en esta carpeta

  destination:
    server: https://kubernetes.default.svc
    namespace: homelab

  syncPolicy:
    automated:
      prune: true      # Elimina recursos del clúster que se borren del repo
      selfHeal: true   # Revierte cambios manuales (kubectl apply fuera de git)
    syncOptions:
      - CreateNamespace=true
