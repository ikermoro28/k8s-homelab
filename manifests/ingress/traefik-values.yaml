deployment:
  replicas: 1

service:
  type: LoadBalancer   # k3d detecta esto y lo conecta al serverlb que ya mapea 8080->80

ports:
  web:
    port: 80
  websecure:
    port: 443

ingressClass:
  enabled: true

# Dashboard de Traefik accesible (útil para debugging)
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.homelab.local`)
    entryPoints: ["web"]

logs:
  general:
    level: INFO
